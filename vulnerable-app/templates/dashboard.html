<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskVault - Dashboard</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container dashboard">
        <header>
            <h2>Task Dashboard</h2>
            <button onclick="logout()" class="btn-logout">Logout</button>
        </header>

        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search tasks by title...">
            <button onclick="searchTasks()">Search</button>
        </div>

        <hr>

        <div class="create-task">
            <h3>Add New Task</h3>
            <form id="createTaskForm">
                <input type="text" id="taskTitle" placeholder="Task Title" required>
                <button type="submit">Create</button>
            </form>
        </div>

        <hr>

        <div id="messageBox" class="message-box"></div>
        
        <!-- TWO SEPARATE BOXES FOR TASKS -->
        <div class="task-sections">
            <div class="task-box">
                <h3 style="color: #4f46e5;">Your Tasks</h3>
                <ul id="myTaskList" class="task-list">
                    <!-- JS injects your tasks here -->
                </ul>
            </div>
            
            <div class="task-box" style="margin-top: 2rem;">
                <h3 style="color: #64748b;">Other Tasks</h3>
                <ul id="otherTaskList" class="task-list">
                    <!-- JS injects other team members' tasks here -->
                </ul>
            </div>
        </div>
    </div>

    <!-- The inline script is GONE. app.js handles the loading safely now. -->
    <script src="/static/app.js"></script>
</body>
</html>
